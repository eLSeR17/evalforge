name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extra (pytest)
        run: pip install -e .[dev]

      - name: Run deterministic test suite
        run: pytest -q

      # NOTE — the live e2e (scripts/run_e2e.py) is deliberately NOT part of
      # CI. It requires the sibling subjects' Docker containers
      # (alpha-agent-demo / scr-rag-demo) and a local Ollama judge on the
      # docker_default network, and its per-case results are stochastic by
      # nature. CI runs only the 223 hermetic tests: no network, no Docker,
      # no Ollama, no secrets. The e2e is documented in docs/LIVE_EVAL.md.